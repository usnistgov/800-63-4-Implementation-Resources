include:
  - project: 'nccoe-static-sites/nccoe-rtd-theme'
    ref: 'main'
    file: '/ci/templates/sphinx_tests.yml'

variables:
  # Base URL used by the included Sphinx CI template to fetch helper scripts.
  SCRIPTS_URL_BASE: https://gitlab.nist.gov/gitlab/nccoe-static-sites/nccoe-rtd-theme/-/raw/main"

stages:
  - build-sphinx
  - test
  - deploy

build_sphinx_app:
  image: python:latest
  stage: build-sphinx
  script:
    - pip install -r requirements.txt
    - make html BUILDDIR=public/nccoe-template
  artifacts:
    paths:
      - public/nccoe-template/
    expire_in: 1 hour

pages:
  image: busybox:latest
  stage: deploy
  script:
    - echo "Deploying GitLab Pages..."
  artifacts:
    paths:
      - public
