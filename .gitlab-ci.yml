include:
  - local: '/ci/templates/sphinx_tests.yml'

default:
  # Ensure expected JUnit report files exist so artifact upload does not fail
  # when an included test job exits before generating them.
  after_script:
    - touch sphinx-warnings-junit.xml linkcheck-junit.xml images-alttext-junit.xml gitlab-links-junit.xml

stages:
  - build-sphinx
  - test
  - deploy

build_sphinx_app:
  image: python:latest
  stage: build-sphinx
  script:
    - pip install -r requirements.txt
    - make html BUILDDIR=public
  artifacts:
    paths:
      - public/
    expire_in: 1 hour

pages:
  image: busybox:latest
  stage: deploy
  script:
    - echo "Deploying GitLab Pages..."
  artifacts:
    paths:
      - public
